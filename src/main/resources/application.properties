# ============================================================
# DineFlow Backend (Spring Boot) - tương đương file .env của Laravel
# ============================================================
server.port=8000

# ---- Database (MySQL, cùng database "dineflow" như bản Laravel) ----
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dineflow?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Tự tạo / cập nhật bảng theo entity (giống "php artisan migrate").
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
# Database lưu giờ UTC (giống APP_TIMEZONE=UTC của Laravel)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ---- JSON: request body đọc theo snake_case (table_id, payment_method...) ----
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# ---- Upload / static ----
spring.web.resources.static-locations=classpath:/static/,file:./storage-public/

# ---- Ứng dụng ----
# Địa chỉ gốc để tạo link ảnh món và link tải Excel (giống APP_URL)
app.url=http://127.0.0.1:8000
# Khóa ký link tải báo cáo (giống APP_KEY). Đổi khi triển khai thật.
app.key=dineflow-secret-key-change-me
# Tạo dữ liệu mẫu khi database còn trống (giống "php artisan db:seed")
app.seed=true

# ---- Thông tin nhà hàng (config/restaurant.php) ----
restaurant.name=DineFlow Restaurant
restaurant.timezone=Asia/Ho_Chi_Minh
restaurant.bank.code=${RESTAURANT_BANK_CODE:MBBank}
restaurant.bank.name=${RESTAURANT_BANK_NAME:MBBank}
restaurant.bank.account-no=${RESTAURANT_BANK_ACCOUNT_NO:14580886868}
restaurant.bank.account-name=${RESTAURANT_BANK_ACCOUNT_NAME:NGUYEN HOANG BAO}

# ---- Gửi email OTP ----
# log  = chỉ ghi email ra console (giống MAIL_MAILER=log)
# smtp = gửi thật qua spring.mail.* bên dưới
app.mail.mode=log
app.mail.from=hello@example.com
app.mail.from-name=DineFlow Restaurant
# Gmail: bật xác minh 2 bước, tạo "Mật khẩu ứng dụng" rồi điền vào đây
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
