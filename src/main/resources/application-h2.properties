# Chạy thử không cần cài MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Dữ liệu lưu trong file ./data/dineflow-h2 (xóa thư mục data để làm lại từ đầu)
spring.datasource.url=jdbc:h2:file:./data/dineflow-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,USER
spring.datasource.username=sa
spring.datasource.password=
