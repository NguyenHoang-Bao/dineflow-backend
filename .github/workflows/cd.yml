name: Backend CD (Build & Docker Image)

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secret
        id: check-dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.check-dockerhub.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.check-dockerhub.outputs.has_dockerhub == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'dineflow' }}/dineflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'dineflow' }}/dineflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    name: Deploy to Server
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 secret & Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "Khong co secret EC2_HOST. Bo qua buoc deploy production."
            exit 0
          fi
          echo "Trien khai den may chu EC2..."
      - name: Deploy container via SSH
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/dineflow || cd /home/ubuntu
            docker compose pull backend || docker-compose pull backend
            docker compose up -d --no-deps backend || docker-compose up -d --no-deps backend
            docker image prune -f
