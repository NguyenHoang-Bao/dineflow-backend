name: Backend CD (Build & Docker Image)

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Kiểm tra và login Docker Hub nếu có secret
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image từ Dockerfile
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'dineflow' }}/dineflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'dineflow' }}/dineflow-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Server (AWS/VPS)
    needs: build-docker
    runs-on: ubuntu-latest
    if: ${{ secrets.EC2_HOST != '' }}

    steps:
      - name: Deploy container via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/dineflow || cd /root/dineflow || cd /home/ubuntu
            docker compose pull backend || docker-compose pull backend
            docker compose up -d --no-deps backend || docker-compose up -d --no-deps backend
            docker image prune -f
