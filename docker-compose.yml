version: '3.8'

services:
  mysql:
    image: mariadb:10.4
    container_name: dineflow-mariadb
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dineflow
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dineflow_mysql_data:/var/lib/mysql

  backend:
    build: .
    image: hoangbao10/dineflow-backend:latest
    container_name: dineflow-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dineflow?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MariaDBDialect
      SEPAY_API_KEY: ""
    depends_on:
      - mysql

volumes:
  dineflow_mysql_data:
